    <style>
        :root {
            --brand-primary: #8b5cf6; /* violet-500 */
            --brand-secondary: #c084fc; /* violet-400 */
        }
        body {
            font-family: 'Alexandria', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #fafafa;
        }
        .luxury-font {
            font-family: 'Playfair Display', serif;
        }
        .brand-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        }
        .glass-panel {
            background: rgba(18, 18, 21, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Border Glow Effect */
        @keyframes border-glow {
            0% { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 0 0 rgba(139, 92, 246, 0); }
            50% { border-color: #8b5cf6; box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
            100% { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 0 0 rgba(139, 92, 246, 0); }
        }

        input:focus, textarea:focus {
            animation: border-glow 2s infinite ease-in-out;
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
